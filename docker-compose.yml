name: store-web

services:
  db:
    image: postgres:15-alpine
    container_name: store_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-store_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - store-network

  backend:
    build:
      context: ./store-backend
      dockerfile: Dockerfile
    container_name: store_backend
    restart: always
    env_file:
      - ./store-backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-store_db}?schema=public
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - store-network

  frontend:
    build:
      context: ./store-frontend
      dockerfile: Dockerfile
    container_name: store_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - store-network

networks:
  store-network:
    driver: bridge

volumes:
  pgdata:
